name: astrbot_plugin_group_watch
display_name: 群聊智能巡视 (GroupWatch)
short_desc: 轻量模型驱动的群聊语境感知、智能主动接话与多轮跟进巡视插件
desc: >-
  基于轻量大语言模型的群聊智能巡视与搭话插件。
  实时监听群聊消息并由轻量评估模型实时分析语境，在适当时机自然主动接话；
  支持多轮对话跟进、关注关键词加权识别、指令静默熔断以及可视化实时监控看板。
help: 可使用 /gw status 查看状态，/gw on 与 /gw off 控制运行开关，/gw silence 控制静默。
version: 1.5.4
author: R0smonti3
repo: https://github.com/R0smonti3/astrbot_plugin_group_watch
category: AI 增强
tags:
  - 智能接话
  - 群聊巡视
  - LLM
  - 聊天增强
astrbot_version: ">=4.17.0"
